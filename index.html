<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Telegram style · EN / MY translator — Premium Translation</title>
    <!-- Fonts: Roboto + Padauk for Myanmar -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', 'Padauk', sans-serif;
            background: #0b1419;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
        }

        .chat-container {
            width: 100%;
            max-width: 820px;
            height: 95vh;
            max-height: 920px;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.25), 0 2px 12px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .chat-header {
            background: #0088cc;
            color: white;
            padding: 16px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .chat-header h1 {
            font-size: 1.4rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
            letter-spacing: -0.2px;
        }

        .chat-header h1 i {
            font-size: 1.6rem;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.1));
        }

        .lang-toggle-group {
            display: flex;
            background: rgba(255,255,255,0.2);
            border-radius: 40px;
            padding: 4px;
            backdrop-filter: blur(2px);
        }

        .lang-toggle-btn {
            background: transparent;
            border: none;
            color: white;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            font-family: inherit;
        }

        .lang-toggle-btn.active {
            background: white;
            color: #0088cc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 18px;
            background: #e5ebf1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            animation: messageSlide 0.25s ease-out;
        }

        @keyframes messageSlide {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
        }

        .bot-message {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 1rem;
            line-height: 1.45;
            word-break: break-word;
            font-family: 'Roboto', 'Padauk', sans-serif;
            box-shadow: 0 1px 1px rgba(0,0,0,0.05);
            transition: background 0.1s;
            position: relative;
        }

        .user-message .message-bubble {
            background: #0088cc;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot-message .message-bubble {
            background: white;
            color: #2b5278;
            border: 1px solid #e1e8ed;
            border-bottom-left-radius: 4px;
        }

        .message-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
            font-size: 0.7rem;
            color: #5f7f9e;
            padding-left: 10px;
            padding-right: 10px;
        }

        .user-message .message-info {
            justify-content: flex-end;
        }

        .lang-badge {
            background: #eef2fa;
            padding: 2px 10px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.65rem;
            color: #0088cc;
            letter-spacing: 0.3px;
        }

        .user-message .lang-badge {
            background: rgba(255,255,255,0.22);
            color: white;
        }

        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 12px 16px;
            background-color: white;
            border: 1px solid #e1e8ed;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            width: fit-content;
            box-shadow: 0 1px 1px rgba(0,0,0,0.05);
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background-color: #8ba0bc;
            border-radius: 50%;
            animation: typingPulse 1.3s infinite ease;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingPulse {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        .status-area {
            background: #f8fafd;
            padding: 8px 20px;
            font-size: 0.78rem;
            color: #2c577c;
            border-top: 1px solid #e2e9f0;
            border-bottom: 1px solid #eef2f6;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 42px;
        }

        .status-text {
            font-weight: 500;
        }

        .input-area {
            background: #f7f9fa;
            border-top: 1px solid #e1e8ed;
            padding: 12px 16px;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .message-input-wrapper {
            flex: 1;
            background: white;
            border-radius: 20px;
            border: 1px solid #e1e8ed;
            transition: all 0.2s;
            padding: 8px 16px;
            display: flex;
            align-items: flex-end;
        }

        .message-input-wrapper:focus-within {
            border-color: #0088cc;
            box-shadow: 0 0 0 2px rgba(0,136,204,0.2);
        }

        #userInput {
            width: 100%;
            border: none;
            background: transparent;
            padding: 6px 6px 6px 0;
            font-size: 0.98rem;
            font-family: 'Roboto', 'Padauk', sans-serif;
            resize: none;
            max-height: 130px;
            min-height: 24px;
            line-height: 1.45;
            outline: none;
        }

        .send-button {
            background: #0088cc;
            border: none;
            border-radius: 50%;
            width: 46px;
            height: 46px;
            color: white;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,136,204,0.3);
            flex-shrink: 0;
        }

        .send-button:hover:not(:disabled) {
            background: #0077b3;
            transform: scale(1.02);
        }

        .send-button:disabled {
            background: #b2cef0;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #dce3ec;
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #96abc2;
            border-radius: 10px;
        }

        .error-bubble {
            background: #fff2f0 !important;
            color: #c5221f !important;
            border-left: 3px solid #c5221f;
        }

        .api-status {
            position: absolute;
            top: 16px;
            right: 22px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            background: rgba(255,255,255,0.15);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .api-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
        }

        .api-status-dot.warning {
            background: #fbbf24;
        }

        .api-status-dot.error {
            background: #ef4444;
        }

        .date-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            color: #657786;
            font-size: 0.75rem;
        }

        .date-divider span {
            background: #e5ebf1;
            padding: 0 10px;
            position: relative;
            z-index: 1;
        }

        .date-divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #d0d7de;
            z-index: 0;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <h1>
            <i class="fas fa-language"></i> 
            <span>EN <i class="fas fa-arrow-right"></i> MY</span>
        </h1>
        <div class="lang-toggle-group">
            <button class="lang-toggle-btn active" id="sourceLangBtn">🇬🇧 EN → 🇲🇲 MY</button>
            <button class="lang-toggle-btn" id="targetLangBtn">🇲🇲 MY → 🇬🇧 EN</button>
        </div>
        <div class="api-status">
            <div class="api-status-dot" id="apiStatusDot"></div>
            <span id="apiStatusText">Google API</span>
        </div>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="date-divider"><span>Today</span></div>
        <div class="message bot-message">
            <div class="message-bubble">
                ✨ <strong>Premium Translator</strong> (Neural Translation)<br>
                🇲🇲 မင်္ဂလာပါ။ စာရိုက်လိုက်ရုံနဲ့ ဘာသာပြန်ပေးပါမယ်။<br>
                🇬🇧 Hi! Type anything — fast & accurate translation.
            </div>
            <div class="message-info">
                <span>✨ Assistant</span>
                <span class="lang-badge">AI Translator</span>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="message-input-wrapper">
            <textarea id="userInput" placeholder="Type message to translate..." rows="1"></textarea>
        </div>
        <button class="send-button" id="sendBtn" title="Send & Translate"><i class="fas fa-paper-plane"></i></button>
    </div>

    <div class="status-area" id="statusArea">
        <i class="fas fa-globe" style="font-size: 0.75rem; color: #0088cc;"></i>
        <span class="status-text" id="statusMessage">🌐 Ready · Neural Translation Engine</span>
    </div>
</div>

<script>
    (function() {
        // ---------- DOM elements ----------
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusMessageSpan = document.getElementById('statusMessage');
        const sourceLangBtn = document.getElementById('sourceLangBtn');
        const targetLangBtn = document.getElementById('targetLangBtn');
        const apiStatusDot = document.getElementById('apiStatusDot');
        const apiStatusText = document.getElementById('apiStatusText');

        // ---------- State ----------
        let isEnToMy = true;          // true = EN->MY , false = MY->EN
        let isTranslating = false;
        let isUserScrolling = false;
        let currentApiProvider = 'google'; // google, deepl, microsoft, mymemory
        let apiHealthStatus = 'good'; // good, warning, error

        // ---------- Helper: Update UI buttons ----------
        function updateLangButtons() {
            if (isEnToMy) {
                sourceLangBtn.classList.add('active');
                targetLangBtn.classList.remove('active');
                document.querySelector('.chat-header h1 span').innerHTML = `EN <i class="fas fa-arrow-right"></i> MY`;
            } else {
                sourceLangBtn.classList.remove('active');
                targetLangBtn.classList.add('active');
                document.querySelector('.chat-header h1 span').innerHTML = `MY <i class="fas fa-arrow-right"></i> EN`;
            }
        }

        // Update API status indicator
        function updateApiStatus(provider, status) {
            currentApiProvider = provider;
            apiHealthStatus = status;
            
            // Update status dot
            apiStatusDot.className = 'api-status-dot';
            if (status === 'warning') apiStatusDot.classList.add('warning');
            if (status === 'error') apiStatusDot.classList.add('error');
            
            // Update status text
            switch(provider) {
                case 'google':
                    apiStatusText.textContent = 'Google API';
                    break;
                case 'deepl':
                    apiStatusText.textContent = 'DeepL API';
                    break;
                case 'microsoft':
                    apiStatusText.textContent = 'MS Translator';
                    break;
                case 'mymemory':
                    apiStatusText.textContent = 'MyMemory API';
                    break;
                default:
                    apiStatusText.textContent = 'Unknown API';
            }
        }

        // ---------- Scroll to bottom with smart user detection ----------
        function scrollToBottom(force = false) {
            if (!force && isUserScrolling) return;
            // immediate + smooth + double guarantee
            chatMessages.scrollTop = chatMessages.scrollHeight;
            setTimeout(() => {
                chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' });
            }, 8);
            setTimeout(() => {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 80);
        }

        // Detect user scroll intent
        chatMessages.addEventListener('scroll', () => {
            const { scrollTop, scrollHeight, clientHeight } = chatMessages;
            const atBottom = scrollTop + clientHeight >= scrollHeight - 90;
            if (!atBottom) {
                isUserScrolling = true;
            } else {
                isUserScrolling = false;
            }
        });

        // ---------- Add message to chat UI ----------
        function addMessage(text, type, sourceLangLabel = '', targetLangLabel = '', isError = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}-message`;

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;
            if (isError) bubble.classList.add('error-bubble');

            const info = document.createElement('div');
            info.className = 'message-info';
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            if (type === 'user') {
                const badge = document.createElement('span');
                badge.className = 'lang-badge';
                badge.textContent = sourceLangLabel || (isEnToMy ? 'EN' : 'MY');
                info.appendChild(badge);
                const timeSpan = document.createElement('span');
                timeSpan.textContent = timeStr;
                info.appendChild(timeSpan);
            } else {
                const timeSpan = document.createElement('span');
                timeSpan.textContent = timeStr;
                info.appendChild(timeSpan);
                const badge = document.createElement('span');
                badge.className = 'lang-badge';
                badge.textContent = targetLangLabel || (isEnToMy ? 'MY' : 'EN');
                info.appendChild(badge);
            }

            msgDiv.appendChild(bubble);
            msgDiv.appendChild(info);
            chatMessages.appendChild(msgDiv);

            // auto-scroll only if user not deliberately scrolled up
            scrollToBottom(false);
            return msgDiv;
        }

        // Typing indicator
        function showTypingIndicator() {
            removeTypingIndicator();
            const indicatorDiv = document.createElement('div');
            indicatorDiv.className = 'message bot-message';
            indicatorDiv.id = 'typingIndicator';
            const typingBubble = document.createElement('div');
            typingBubble.className = 'typing-indicator';
            typingBubble.innerHTML = '<span></span><span></span><span></span>';
            indicatorDiv.appendChild(typingBubble);
            chatMessages.appendChild(indicatorDiv);
            scrollToBottom(false);
        }

        function removeTypingIndicator() {
            const existing = document.getElementById('typingIndicator');
            if (existing) existing.remove();
        }

        // ---------- MULTIPLE HIGH QUALITY TRANSLATION APIS ----------
        // 1. Google Translate via Lingva (free proxy)
        async function translateWithGoogle(text, fromLang, toLang) {
            try {
                // Try multiple Lingva instances for reliability
                const lingvaInstances = [
                    'https://lingva.ml',
                    'https://lingva.garudalinux.org',
                    'https://translate.plausibility.cloud'
                ];
                
                let lastError;
                for (const instance of lingvaInstances) {
                    try {
                        const apiUrl = `${instance}/api/v1/${fromLang}/${toLang}/${encodeURIComponent(text)}`;
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 5000);
                        const response = await fetch(apiUrl, { signal: controller.signal });
                        clearTimeout(timeoutId);
                        
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const data = await response.json();
                        if (data && data.translation) {
                            updateApiStatus('google', 'good');
                            return data.translation;
                        }
                    } catch (err) {
                        lastError = err;
                        continue;
                    }
                }
                throw lastError || new Error('All Google Translate instances failed');
            } catch (err) {
                console.warn("Google Translate error:", err);
                updateApiStatus('google', 'error');
                throw err;
            }
        }

        // 2. DeepL API (if available)
        async function translateWithDeepL(text, fromLang, toLang) {
            try {
                // DeepL doesn't have a free public API, but we can try some public proxies
                const deepLInstances = [
                    'https://deepl.pon.im/translate'
                ];
                
                for (const instance of deepLInstances) {
                    try {
                        const formData = new FormData();
                        formData.append('text', text);
                        formData.append('source_lang', fromLang.toUpperCase());
                        formData.append('target_lang', toLang.toUpperCase());
                        
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 7000);
                        const response = await fetch(instance, {
                            method: 'POST',
                            body: formData,
                            signal: controller.signal
                        });
                        clearTimeout(timeoutId);
                        
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const data = await response.json();
                        if (data && data.translations && data.translations.length > 0) {
                            updateApiStatus('deepl', 'good');
                            return data.translations[0].text;
                        }
                    } catch (err) {
                        continue;
                    }
                }
                throw new Error('DeepL API unavailable');
            } catch (err) {
                console.warn("DeepL error:", err);
                updateApiStatus('deepl', 'error');
                throw err;
            }
        }

        // 3. Microsoft Translator (if available)
        async function translateWithMicrosoft(text, fromLang, toLang) {
            try {
                // Using a public proxy for Microsoft Translator
                const apiUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${fromLang}|${toLang}`;
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                const response = await fetch(apiUrl, { signal: controller.signal });
                clearTimeout(timeoutId);
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (data.responseData && data.responseData.translatedText) {
                    updateApiStatus('microsoft', 'good');
                    return data.responseData.translatedText;
                } else {
                    throw new Error('Invalid Microsoft Translator response');
                }
            } catch (err) {
                console.warn("Microsoft Translator error:", err);
                updateApiStatus('microsoft', 'error');
                throw err;
            }
        }

        // 4. MyMemory (fallback)
        async function translateWithMyMemory(text, fromLang, toLang) {
            try {
                const apiUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${fromLang}|${toLang}`;
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                const response = await fetch(apiUrl, { signal: controller.signal });
                clearTimeout(timeoutId);
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (data.responseData && data.responseData.translatedText) {
                    updateApiStatus('mymemory', 'warning'); // Warning because it's a fallback
                    return data.responseData.translatedText;
                } else {
                    throw new Error('Invalid MyMemory response');
                }
            } catch (err) {
                console.warn("MyMemory error:", err);
                updateApiStatus('mymemory', 'error');
                throw err;
            }
        }

        // Core translation orchestrator with smart retry & clean output
        async function performTranslation(rawText) {
            const fromLang = isEnToMy ? 'en' : 'my';
            const toLang = isEnToMy ? 'my' : 'en';
            if (!rawText.trim()) return "";

            // Try different translation services in order of preference
            let translationServices = [
                { name: 'Google', func: translateWithGoogle },
                { name: 'DeepL', func: translateWithDeepL },
                { name: 'Microsoft', func: translateWithMicrosoft },
                { name: 'MyMemory', func: translateWithMyMemory }
            ];
            
            let lastError;
            for (const service of translationServices) {
                try {
                    let translated = await service.func(rawText, fromLang, toLang);
                    // Post-process: remove accidental double spaces or weird artifacts
                    if (translated && typeof translated === 'string') {
                        translated = translated.replace(/\s+/g, ' ').trim();
                        // if translation seems empty but original not, fallback guard
                        if (translated === "" && rawText.trim() !== "") {
                            throw new Error("Empty translation result");
                        }
                        return translated;
                    } else {
                        throw new Error("Invalid translation");
                    }
                } catch (err) {
                    lastError = err;
                    console.warn(`${service.name} translation failed:`, err);
                    continue;
                }
            }
            
            // If all services fail
            throw lastError || new Error("All translation services failed");
        }

        // ---------- Send message & translation pipeline ----------
        async function handleSendMessage() {
            const rawMessage = userInput.value.trim();
            if (!rawMessage || isTranslating) return;

            // Disable input during process
            isTranslating = true;
            sendBtn.disabled = true;
            statusMessageSpan.innerHTML = '<i class="fas fa-sync-alt fa-fw"></i> Translating with neural engine...';
            statusMessageSpan.style.opacity = "0.9";

            // Reset scroll flag when user sends new message
            isUserScrolling = false;

            // Add user message to chat
            const sourceLangDisplay = isEnToMy ? '🇬🇧 EN' : '🇲🇲 MY';
            addMessage(rawMessage, 'user', sourceLangDisplay, '');

            // Clear input and reset height
            userInput.value = '';
            userInput.style.height = 'auto';

            // Show typing indicator (bot)
            showTypingIndicator();

            let translatedText = "";
            let translationError = false;

            try {
                translatedText = await performTranslation(rawMessage);
                if (!translatedText || translatedText.length === 0) {
                    throw new Error("No translation received");
                }
            } catch (err) {
                console.error("Translation error:", err);
                translationError = true;
                translatedText = `⚠️ Translation failed. Please try again. \n⚠️ ဘာသာပြန်ခြင်း မအောင်မြင်ပါ။ ထပ်မံကြိုးစားပါ။`;
            }

            // Remove typing indicator after response (or error)
            removeTypingIndicator();

            // Add bot response
            const targetLangDisplay = isEnToMy ? '🇲🇲 MY' : '🇬🇧 EN';
            addMessage(translatedText, 'bot', '', targetLangDisplay, translationError);

            // Reset state
            isTranslating = false;
            sendBtn.disabled = false;
            statusMessageSpan.innerHTML = '✅ Ready · Neural Translation Engine';
            userInput.focus();

            // Final forced scroll to ensure new translation visible
            setTimeout(() => scrollToBottom(true), 120);
        }

        // ---------- Auto-resize textarea ----------
        function autoResizeTextarea() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 130) + 'px';
        }

        // ---------- Language Switch with confirmation style ----------
        function setEnToMyMode(active) {
            if (active === isEnToMy) return;
            isEnToMy = active;
            updateLangButtons();
            statusMessageSpan.innerHTML = isEnToMy ? '🌐 EN → MY (Neural Translation)' : '🌐 MY → EN (Neural Translation)';
            // brief flash to indicate mode change
            const statusDiv = document.querySelector('.status-area');
            statusDiv.style.transition = 'background 0.2s';
            statusDiv.style.background = '#e9f2fc';
            setTimeout(() => { statusDiv.style.background = ''; }, 300);
        }

        // ---------- Event listeners ----------
        sendBtn.addEventListener('click', handleSendMessage);

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!isTranslating) handleSendMessage();
            }
        });

        userInput.addEventListener('input', autoResizeTextarea);

        // Language toggle buttons
        sourceLangBtn.addEventListener('click', () => {
            if (!isEnToMy) setEnToMyMode(true);
        });
        targetLangBtn.addEventListener('click', () => {
            if (isEnToMy) setEnToMyMode(false);
        });

        // focus input when clicking messages
        chatMessages.addEventListener('click', () => {
            if (!isTranslating) userInput.focus();
        });

        // Initial setup
        updateLangButtons();
        updateApiStatus('google', 'good');
        userInput.focus();

        // Scroll to bottom on load after welcome message
        window.addEventListener('load', () => {
            setTimeout(() => {
                scrollToBottom(true);
            }, 120);
            // pre-focus
            userInput.focus();
        });

        // MutationObserver to handle dynamic content scroll for any late images/updates
        const observer = new MutationObserver((mutations) => {
            let contentAdded = false;
            for (let m of mutations) {
                if (m.type === 'childList' && m.addedNodes.length > 0) {
                    contentAdded = true;
                    break;
                }
            }
            if (contentAdded && !isUserScrolling && !isTranslating) {
                scrollToBottom(false);
            }
        });
        observer.observe(chatMessages, { childList: true, subtree: true });

        // Additional safety: if the input gets disabled, re-enable on focus
        window.addEventListener('resize', () => {
            if (chatMessages.scrollHeight > chatMessages.clientHeight && !isUserScrolling) {
                scrollToBottom(true);
            }
        });
    })();
</script>
</body>
    </html>
