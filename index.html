<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Style Translator</title>
    <link href="https://fonts.googleapis.com/css2?family=Padauk&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --tg-blue: #2481cc;
            --tg-bg: #547594; /* Classic Telegram Background */
            --tg-user-bubble: #effdde; /* Light green for outgoing messages */
            --tg-bot-bubble: #ffffff;
            --tg-text: #000000;
            --tg-secondary: #707579;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Roboto', 'Padauk', sans-serif;
            background-color: #212121;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 500px; /* Mobile focused width */
            height: 100vh;
            background: var(--tg-bg);
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); /* Pattern overlay */
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Header Section --- */
        .chat-header {
            background: #ffffff;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .back-btn { color: var(--tg-secondary); font-size: 1.2rem; cursor: pointer; }

        .header-info { flex: 1; }
        .header-info h2 { font-size: 1rem; color: #000; }
        .header-info p { font-size: 0.8rem; color: var(--tg-blue); }

        .lang-switch {
            background: #f1f1f1;
            padding: 4px;
            border-radius: 20px;
            display: flex;
            gap: 2px;
        }

        .lang-btn {
            border: none;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .lang-btn.active { background: var(--tg-blue); color: white; }

        /* --- Messages Area --- */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 12px;
            position: relative;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: fadeIn 0.15s ease-out;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background: var(--tg-user-bubble);
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            align-self: flex-start;
            background: var(--tg-bot-bubble);
            border-bottom-left-radius: 2px;
        }

        .msg-time {
            font-size: 0.7rem;
            margin-top: 4px;
            text-align: right;
            color: #5fb389; /* Greenish time for user */
        }

        .bot-message .msg-time { color: var(--tg-secondary); }

        /* --- Input Area --- */
        .input-container {
            padding: 10px;
            background: transparent;
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .input-wrapper {
            background: white;
            flex: 1;
            border-radius: 22px;
            padding: 8px 15px;
            display: flex;
            align-items: flex-end;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        #userInput {
            flex: 1;
            border: none;
            outline: none;
            padding: 5px 0;
            font-size: 1rem;
            max-height: 150px;
            resize: none;
            font-family: inherit;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--tg-secondary);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 5px;
        }

        .send-btn {
            background: var(--tg-blue);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        .send-btn:active { transform: scale(0.9); }

        /* Custom Scrollbar */
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <i class="fas fa-arrow-left back-btn"></i>
        <div class="header-info">
            <h2 id="botName">Translator Bot</h2>
            <p id="botStatus">online</p>
        </div>
        <div class="lang-switch">
            <button class="lang-btn active" id="enMyBtn">EN</button>
            <button class="lang-btn" id="myEnBtn">MY</button>
        </div>
    </div>

    <div class="chat-messages" id="chatContainer">
        <div class="message bot-message">
            Translate texts instantly! Just type.
            <div class="msg-time">10:00 AM</div>
        </div>
    </div>

    <div class="input-container">
        <div class="input-wrapper">
            <button class="icon-btn"><i class="far fa-smile"></i></button>
            <textarea id="userInput" placeholder="Message" rows="1"></textarea>
            <button class="icon-btn"><i class="fas fa-paperclip"></i></button>
        </div>
        <button class="send-btn" id="sendBtn">
            <i class="fas fa-paper-plane" id="sendIcon"></i>
        </button>
    </div>
</div>

<script>
    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const enMyBtn = document.getElementById('enMyBtn');
    const myEnBtn = document.getElementById('myEnBtn');
    const botStatus = document.getElementById('botStatus');

    let isEnToMy = true;

    // Toggle Language
    enMyBtn.onclick = () => { isEnToMy = true; enMyBtn.classList.add('active'); myEnBtn.classList.remove('active'); };
    myEnBtn.onclick = () => { isEnToMy = false; myEnBtn.classList.add('active'); enMyBtn.classList.remove('active'); };

    // Auto-resize textarea
    userInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // Clear input
        userInput.value = '';
        userInput.style.height = 'auto';

        // Add User Message
        appendMessage(text, 'user');
        
        // Show Typing...
        botStatus.innerText = 'typing...';
        
        try {
            const from = isEnToMy ? 'en' : 'my';
            const to = isEnToMy ? 'my' : 'en';
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`);
            const data = await res.json();
            
            appendMessage(data.responseData.translatedText, 'bot');
        } catch (err) {
            appendMessage("Error connecting to server.", 'bot');
        } finally {
            botStatus.innerText = 'online';
        }
    }

    function appendMessage(text, side) {
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${side}-message`;
        msgDiv.innerHTML = `${text} <div class="msg-time">${time}</div>`;
        
        chatContainer.appendChild(msgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    sendBtn.onclick = sendMessage;
    userInput.onkeydown = (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };

</script>

</body>
</html>
